name: Flutter Encounter CI

on:
  push:
    branches: [main]
    paths:
      - 'examples/flutter/encounter/**'
      - '.github/workflows/flutter_encounter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/flutter/encounter/**'
      - '.github/workflows/flutter_encounter.yml'

jobs:
  test:
    name: Flutter Analyze & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Install dependencies
        working-directory: examples/flutter/encounter
        run: flutter pub get

      - name: Verify formatting
        working-directory: examples/flutter/encounter
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        working-directory: examples/flutter/encounter
        run: flutter analyze --fatal-infos

      - name: Run tests
        working-directory: examples/flutter/encounter
        run: flutter test

      - name: Build macOS (debug)
        if: runner.os == 'macOS'
        working-directory: examples/flutter/encounter
        run: flutter build macos --debug

      - name: Build Linux (debug)
        if: runner.os == 'Linux'
        working-directory: examples/flutter/encounter
        run: flutter build linux --debug

      - name: Build Windows (debug)
        if: runner.os == 'Windows'
        working-directory: examples/flutter/encounter
        run: flutter build windows --debug
