[package]
name = "mesh-identity"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Peer identity, offline encounters, and Byzantine group admission governance."
repository = "https://github.com/afstanton/mesh-identity"
readme = "README.md"

[dependencies]
# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Serialization & encoding
cbor2 = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
base64 = "0.22"

# Group admission dependencies (optional)
ciborium = { version = "0.2", optional = true }
serde_json = { version = "1.0", optional = true }

# OpenPGP interoperability (pure Rust, optional)
pgp = { version = "0.21", optional = true }

[dev-dependencies]
hex-literal = "0.4"
sha1_smol = "1"
ring = "0.17"
serde_json = "1.0"

[features]
default = []
groups = ["dep:ciborium", "dep:serde_json"]
openpgp = ["dep:pgp"]
test-support = []
