[package]
name = "mesh-identity"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Peer identity, offline encounters, and Byzantine group admission governance."

[dependencies]
# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Serialization & encoding
cbor2 = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# OpenPGP interoperability (pure Rust, optional)
pgp = { version = "0.21", optional = true }

[dev-dependencies]
hex-literal = "0.4"
sha1_smol = "1"
ring = "0.17"

[features]
default = []
groups = []
openpgp = ["dep:pgp"]
test-support = []
