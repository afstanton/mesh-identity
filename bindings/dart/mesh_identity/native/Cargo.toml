[package]
name = "mesh_identity_ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
mesh-identity = { version = "0.1.0", features = ["groups"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
zeroize = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
