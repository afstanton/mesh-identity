name: mesh_identity
description: >-
  Pure Dart bindings for mesh-identity: cryptographic peer identity lifecycle,
  contact management, durable snapshot persistence, offline Encounter ceremonies,
  device-to-device handoff, Byzantine group admission governance, and OpenPGP bridge.
version: 0.5.1
repository: https://github.com/afstanton/mesh-identity

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  ffi: ^2.1.2
  hooks: ^2.2.0
  native_toolchain_rust: ^1.1.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
